name: sgs-sentinel-app
region: nyc
features:
  - buildpack-stack=ubuntu-22

services:
  - name: sgs-sentinel-core
    environment_slug: python
    source_dir: /
    http_port: 8000
    run_command: export PYTHONPATH=$PYTHONPATH:. && gunicorn app.main:app --bind 0.0.0.0:8000 --workers 1 --threads 1 --worker-class gthread
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: SECRET_KEY
        value: ${SECRET_KEY}
      - key: DATABASE_URL
        value: ${DATABASE_URL}
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    github:
      repo: g1n0mag1k/sgs-sentinel-core
      branch: main
      deploy_on_push: true

ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: sgs-sentinel-core

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

