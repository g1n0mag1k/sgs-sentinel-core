[tool]
name = "sgs-sentinel-core"
version = "0.1.0"
description = "A core application for managing sentinel functionalities."
authors = ["g1n0mag1k <your-email@example.com>"]
license = "MIT"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.8"
flask = "^2.0"
sqlalchemy = "^1.4"
alembic = "^1.7"

[tool.poetry.dev-dependencies]
pytest = "^6.2"
black = "^21.7b0"
isort = "^5.9"

[tool.poetry.scripts]
start = "sgs_sentinel_core.main:main"